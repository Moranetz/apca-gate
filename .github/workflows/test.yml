name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python apca.py --selftest
      - run: python -m pytest -v

  reference:
    # Reruns apca-w3 itself and fails if a committed expected value is off by more than 1e-9.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-save apca-w3@0.1.9
      - run: node tools/gen_reference.mjs > regenerated.json
      - run: python3 tools/compare_reference.py regenerated.json tests/reference_apca_w3_0.1.9.json
