name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python apca.py --selftest
      - run: python -m pytest -v

  reference:
    # Reruns apca-w3 itself and fails if the committed expected values differ.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save apca-w3@0.1.9
      - run: node tools/gen_reference.mjs > regenerated.json
      - run: diff regenerated.json tests/reference_apca_w3_0.1.9.json
